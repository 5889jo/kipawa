    <style>
      .page-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #fff;
        color: #073274;
        opacity: 1;
        visibility: visible;
        transition: opacity 300ms ease, visibility 300ms ease;
      }

      .page-loader--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .page-loader__spinner {
        position: relative;
        width: 76px;
        height: 76px;
      }

      .page-loader__logo {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 70px;
        height: 70px;
        object-fit: contain;
        transform: translate(-50%, -50%);
      }

      .page-loader__dot {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 7px;
        height: 7px;
        margin: -3.5px;
        border-radius: 50%;
        background: currentColor;
        transform: rotate(var(--rotation)) translateY(-32px);
        animation: page-loader-pulse 1.1s ease-in-out infinite;
        animation-delay: var(--delay);
      }

      @keyframes page-loader-pulse {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .page-loader,
        .page-loader__dot {
          animation: none;
          transition: none;
        }
      }
    </style>
    <title>VETA Kipawa ICT Centre | Practical Technical Training</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "VETA Kipawa ICT Centre",
        "description": "Vocational training centre in Dar es Salaam offering practical ICT, electrical, electronics, and mechatronics training.",
        "areaServed": "Dar es Salaam, Tanzania",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Karakata, Kipawa Ward, Ilala District",
          "addressLocality": "Dar es Salaam",
          "addressCountry": "TZ"
        },
        "email": "kict@veta.go.tz",
        "telephone": "+255 22 284 3360"
      }
    </script>
  </head>
  <body>
    <div id="page-loader" class="page-loader" role="status" aria-label="Loading page">

        <span class="page-loader__dot" style="--rotation: 0deg; --delay: 0ms"></span>
        <span class="page-loader__dot" style="--rotation: 30deg; --delay: -90ms"></span>
        <span class="page-loader__dot" style="--rotation: 60deg; --delay: -180ms"></span>

        <span class="page-loader__dot" style="--rotation: 180deg; --delay: -540ms"></span>
        <span class="page-loader__dot" style="--rotation: 210deg; --delay: -630ms"></span>
        <span class="page-loader__dot" style="--rotation: 240deg; --delay: -720ms"></span>
        <span class="page-loader__dot" style="--rotation: 270deg; --delay: -810ms"></span>
        <span class="page-loader__dot" style="--rotation: 300deg; --delay: -900ms"></span>
        <span class="page-loader__dot" style="--rotation: 330deg; --delay: -990ms"></span>
